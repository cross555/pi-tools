services:
  web:
    # Public image published to GHCR by .github/workflows/publish.yml.
    # Replace YOUR_GITHUB_USERNAME (lowercase) and always pin a version tag, never :latest.
    image: ghcr.io/cross555/pi-tools:0.1.0
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18431:8080"
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      DEFAULT_FORMAT: ${DEFAULT_FORMAT}
      DEFAULT_QUALITY: ${DEFAULT_QUALITY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
